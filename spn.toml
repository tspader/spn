[package]
namespace = "spader"
name = "spn"
version = "0.4.5"
repo = "tspader/spn"
include = ["include"]

[package.configure]
source = ["tools/spn/configure.c", "tools/spn/wasi.c"]
include = ["include", "tools"]

[package.build]
source = [
  "tools/spn/build.c",
  "tools/spn/wasi.c",
  "tools/jtd.c",
  "tools/gen/lower.c",
  "tools/gen/bind.c",
  "tools/gen/union.c",
  "tools/gen/abi.c",
  "tools/gen/data.c",
  "tools/gen/run.c",
]
include = ["include", "source/core", "source/util", "tools", "tools/gen"]

[deps.package]
"spader/sp" = { path = "vendor/sp" }
wamr = { path = "vendor/wamr" }
toml = "1.6.0"
yyjson = "0.14.0"
blake3 = "1.8.7"

[deps.build]
"spader/sp" = { path = "vendor/sp" }
yyjson = "0.14.0"

[patch."spader/sp"]
files = [
  "tools/patches/sp-test-num-cpus.patch",
  "tools/patches/sp-prompt-external-wake.patch",
]

[patch.wamr]
files = [
  "tools/patches/wamr-wasi-hook.patch",
  "tools/patches/wamr-darwin-timeb.patch",
  "tools/patches/wamr-win-readdir.patch",
  "tools/patches/wamr-sanitize.patch",
  "tools/patches/wamr-musl-stack.patch",
  "tools/patches/wamr-mingw-tls.patch",
]

[profile.default]
toolchain = "zig"
linkage = "static"
standard = "c11"
mode = "debug"

[profile.musl]
toolchain = "zig"
abi = "musl"

[profile.gnu]
toolchain = "zig"
abi = "gnu"
linkage = "shared"

[profile.mingw]
toolchain = "zig"
os = "windows"
abi = "gnu"

[profile.msvc]
toolchain = "msvc"
abi = "msvc"

[profile.sanitizer]
toolchain = "clang"
linkage = "shared"
sanitize = ["address", "undefined"]

[[lib]]
name = "spn"
kinds = ["static"]
source = [
  "source/core/**/*.c",
  "source/util/**/*.c",
  "source/core/codegen/gen/abi.gen.c",
  "source/core/codegen/gen/config.gen.c",
  "source/core/codegen/gen/errors.gen.c",
  "source/core/codegen/gen/events.gen.c",
  "source/core/codegen/gen/fuzz.gen.c",
  "source/core/codegen/gen/manifest.gen.c",
  "source/core/codegen/gen/release.gen.c",
  "source/core/codegen/gen/source_deps.gen.c",
  "source/core/codegen/gen/toolchains.gen.c",
]
include = ["include", "source/core", "source/util", "source/core/external", "source/core/codegen/gen"]

[[bin]]
name = "spn"
source = ["source/cli/**/*.c"]
include = ["include", "source/cli", "source/util"] # @spader removed the core include
deps = ["spn"]
system_deps = [
  # spn self install reads and writes HKCU\Environment and broadcasts
  # WM_SETTINGCHANGE, which msvc will not resolve without these
  { value = "advapi32", when = { os = "windows" } },
  { value = "user32", when = { os = "windows" } },
]
flags = []

[[script]]
name = "installer"
source = ["tools/install/main.c", "tools/install/render.c"]
include = ["tools/install"]

