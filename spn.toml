[package]
namespace = "spader"
name = "spn"
version = "0.2.0"
repo = "tspader/spn"
include = ["include"]

[package.configure]
source = ["tools/spn/configure.c", "tools/spn/wasi.c"]
include = ["include", "tools"]

[package.build]
source = [
  "tools/spn/build.c",
  "tools/spn/wasi.c",
  "tools/jtd.c",
  "tools/gen/lower.c",
  "tools/gen/bind.c",
  "tools/gen/union.c",
  "tools/gen/abi.c",
  "tools/gen/run.c",
]
include = ["include", "source", "tools", "tools/gen"]

[deps.package]
"spader/sp" = { path = "vendor/sp" }
wamr = { path = "vendor/wamr" }
toml = "1.4.0"
yyjson = "0.13.0"

[deps.build]
"spader/sp" = { path = "vendor/sp" }
yyjson = "0.13.0"

[patch.wamr]
files = [
  "tools/patches/wamr-wasi-hook.patch",
  "tools/patches/wamr-darwin-timeb.patch",
  "tools/patches/wamr-win-readdir.patch",
]

[profile.default]
toolchain = "zig"
linkage = "static"
standard = "c11"
mode = "debug"

[profile.musl]
toolchain = "zig"
abi = "musl"

[profile.sanitizer]
linkage = "shared"
sanitize = ["address", "undefined"]

[[toolchain]]
name = "mingw"
compiler = "x86_64-w64-mingw32-gcc"
linker = "x86_64-w64-mingw32-ld"
archiver = "x86_64-w64-mingw32-ar"
driver = "gcc"
target = [
  { arch = "x86_64", os = "windows", abi = "mingw" }
]

[[bin]]
name = "spn"
source = [
  "source/**/*.c",
  "source/codegen/gen/abi.gen.c",
  "source/codegen/gen/config.gen.c",
  "source/codegen/gen/errors.gen.c",
  "source/codegen/gen/events.gen.c",
  "source/codegen/gen/fuzz.gen.c",
  "source/codegen/gen/manifest.gen.c",
  "source/codegen/gen/release.gen.c",
  "source/codegen/gen/toolchains.gen.c",
]
include = ["include", "source", "source/external", "source/codegen/gen"]
flags = []

