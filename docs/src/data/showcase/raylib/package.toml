[package]
name = "raylib"
version = "6.0.0"
author = "raysan5"
maintainer = "tspader"
system_deps = [
  { lib = "m", when = { os = "linux" } },
  { lib = "pthread", when = { os = "linux" } },
  { lib = "dl", when = { os = "linux" } },
  { lib = "user32", when = { os = "windows" } },
  { lib = "gdi32", when = { os = "windows" } },
  { lib = "shell32", when = { os = "windows" } },
  { lib = "winmm", when = { os = "windows" } },
]

[package.upstream]
url = "https://github.com/raysan5/raylib.git"
commit = "a4680fc67734754138650138f11c54dc798ede56"

[[lib]]
name = "raylib"
kinds = ["static"]
source = [
  "src/rcore.c",
  "src/rshapes.c",
  "src/rtextures.c",
  "src/rtext.c",
  "src/rmodels.c",
  "src/raudio.c",
  { path = "src/rglfw.c", when = { os = { not = "macos" } } },
  { path = "rglfw.m", tree = "manifest", when = { os = "macos" } },
]
include = [
  "src",
  "src/external/glfw/include",
]
define = [
  "PLATFORM_DESKTOP_GLFW",
  "GRAPHICS_API_OPENGL_33",
  { value = "_GLFW_X11", when = { os = "linux" } },
  { value = "SUPPORT_CLIPBOARD_IMAGE=0", when = { os = "linux" } },
  { value = "_CRT_SECURE_NO_WARNINGS", when = { os = "windows" } },
  { value = "GL_SILENCE_DEPRECATION", when = { os = "macos" } },
]

[lib.macos]
frameworks = ["Cocoa", "IOKit", "CoreFoundation", "CoreAudio", "CoreVideo", "OpenGL"]

[[example]]
name = "core_basic_window"
source = ["examples/core/core_basic_window.c"]
deps = ["raylib"]

[[example]]
name = "core_input_keys"
source = ["examples/core/core_input_keys.c"]
deps = ["raylib"]

[[example]]
name = "core_3d_camera_mode"
source = ["examples/core/core_3d_camera_mode.c"]
deps = ["raylib"]

[[example]]
name = "shapes_basic_shapes"
source = ["examples/shapes/shapes_basic_shapes.c"]
deps = ["raylib"]

[[example]]
name = "text_format_text"
source = ["examples/text/text_format_text.c"]
deps = ["raylib"]

[publish]
copy = [
  { from = "source/src/raylib.h", to = "include" },
  { from = "source/src/raymath.h", to = "include" },
  { from = "source/src/rlgl.h", to = "include" },
  { from = "source/src/rcamera.h", to = "include" },
]
