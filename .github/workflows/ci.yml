
name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SPN_STORAGE_DIR: ${{ github.workspace }}/.cache/spn
  SELFHOST_EPOCH: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux, os: ubuntu-latest }
          - { id: aarch64-macos, os: macos-latest }
          - { id: x86_64-windows, os: windows-latest }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - id: stage0
        run: echo "version=$(sh tools/stage0.sh --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spn/stage0
          key: stage0-${{ matrix.id }}-${{ steps.stage0.outputs.version }}
      - uses: actions/cache/restore@v4
        id: state
        with:
          path: |
            .cache
            build
          key: selfhost-e${{ env.SELFHOST_EPOCH }}-s${{ steps.stage0.outputs.version }}-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: selfhost-e${{ env.SELFHOST_EPOCH }}-s${{ steps.stage0.outputs.version }}-${{ matrix.id }}-

      - run: tools/devenv.ps1
        if: runner.os == 'Windows'
        shell: pwsh

      - run: make ci-selfhost

      - uses: actions/cache/save@v4
        with:
          path: |
            .cache
            build
          key: ${{ steps.state.outputs.cache-primary-key }}

  package:
    needs: [build]
    uses: ./.github/workflows/package.yml
    with:
      channel: canary

  canary:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum spn-* > SHASUMS256.txt
      - run: |
          chmod +x dist/installer_render
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' spn.toml)"
          dist/installer_render dist/SHASUMS256.txt tools/install/templates dist "${version}" canary ${{ github.repository }}
      - run: gh release upload canary dist/spn-* dist/SHASUMS256.txt dist/install.sh dist/install.ps1 --clobber --repo ${{ github.repository }}

  ci:
    name: ci
    if: ${{ !cancelled() }}
    needs: [build, package, canary]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJson(needs) }}
        run: jq --exit-status '(.build.result == "success") and (.package.result == "success") and (.canary.result == "success" or .canary.result == "skipped")' <<< "$NEEDS"
