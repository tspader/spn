
name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SPN_STORAGE_DIR: ${{ github.workspace }}/.cache/spn

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux, os: ubuntu-latest }
          - { id: aarch64-macos, os: macos-latest }
          - { id: x86_64-windows, os: windows-latest }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            build
            ~/.cache/spn/stage0
          key: selfhost-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: selfhost-${{ matrix.id }}-

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - run: make ci-selfhost

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .cache
            build
            ~/.cache/spn/stage0
          key: selfhost-${{ matrix.id }}-${{ github.run_id }}

  package:
    needs: [build]
    uses: ./.github/workflows/package.yml
    with:
      channel: canary

  canary:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum spn-* > SHASUMS256.txt
      - run: gh release upload canary spn-* SHASUMS256.txt --clobber --repo ${{ github.repository }}

  ci:
    name: ci
    if: ${{ !cancelled() }}
    needs: [build, package, canary]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJson(needs) }}
        run: jq --exit-status '(.build.result == "success") and (.package.result == "success") and (.canary.result == "success" or .canary.result == "skipped")' <<< "$NEEDS"
