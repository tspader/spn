name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - run: test "${{ github.ref }}" = "refs/heads/main"
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' spn.toml)"
          test "v${version}" = "${TAG}"
      - run: |
          for workflow in ci bootstrap; do
            sh tools/greenlit.sh "${workflow}" ${{ github.sha }}
          done

  package:
    needs: [check]
    uses: ./.github/workflows/package.yml
    with:
      channel: stable

  release:
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum spn-* > SHASUMS256.txt
      - run: |
          chmod +x dist/installer_render
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' spn.toml)"
          dist/installer_render dist/SHASUMS256.txt tools/install/templates dist "${version}" "${TAG}" ${{ github.repository }}
      - run: gh release create "${TAG}" dist/spn-* dist/SHASUMS256.txt dist/install.sh dist/install.ps1 --repo ${{ github.repository }} --target ${{ github.sha }} --title "${TAG}" --generate-notes

  smoke:
    needs: [release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh" | sh
          "${HOME}/.spn/bin/spn" --version
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://github.com/${{ github.repository }}/releases/download/$env:TAG/install.ps1" | iex
          & "$Home\.spn\bin\spn.exe" --version
