name: selfhost

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SPN_STORAGE_DIR: ${{ github.workspace }}/.cache/spn

jobs:
  selfhost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux, os: ubuntu-latest }
          - { id: aarch64-macos, os: macos-latest }
          - { id: x86_64-windows, os: windows-latest }
    name: selfhost-${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            build
            ~/.cache/spn/stage0
          key: selfhost-${{ matrix.id }}-${{ github.sha }}
          restore-keys: selfhost-${{ matrix.id }}-

      - run: make ci-selfhost
