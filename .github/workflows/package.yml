name: package

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig
  SPN_STORAGE_DIR: ${{ github.workspace }}/.cache/spn

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux, os: ubuntu-latest, triple: x86_64-linux-musl, ext: tar.gz, exe: spn, tar: tar, render: .build/store/x86_64-linux-gnu/bin/installer_render }
          - { id: aarch64-macos, os: macos-latest, triple: aarch64-macos-none, ext: tar.gz, exe: spn, tar: tar, render: .build/store/aarch64-macos-none-release/bin/installer_render }
          - { id: x86_64-windows, os: windows-latest, triple: x86_64-windows-msvc, ext: zip, exe: spn.exe, tar: C:/Windows/System32/tar.exe, render: .build/store/x86_64-windows-msvc-release/bin/installer_render.exe }
    name: package-${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SPN_BUILD_CHANNEL: ${{ inputs.channel }}
      SPN_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            .build/source
            ~/.cache/spn/toolchain
          key: ci-${{ matrix.id }}-release-${{ github.sha }}
          restore-keys: ci-${{ matrix.id }}-release-

      - run: make CONFIG=Release TRIPLE=${{ matrix.triple }}
      - run: ${{ matrix.tar }} -a -cf spn-${{ matrix.id }}.${{ matrix.ext }} -C .build/store/${{ matrix.triple }}-release/bin ${{ matrix.exe }}
        env:
          COPYFILE_DISABLE: 1
      - run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' spn.toml)"
          sha="$(printf '%.9s' '${{ github.sha }}')"
          if [ "${{ inputs.channel }}" = "stable" ]; then
            expected="spn ${version} (${sha})"
          else
            expected="spn ${version} (${{ inputs.channel }} ${sha})"
          fi
          mkdir smoke
          ${{ matrix.tar }} -a -xf spn-${{ matrix.id }}.${{ matrix.ext }} -C smoke
          actual="$(smoke/${{ matrix.exe }} --version)"
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          test "${actual}" = "${expected}"
      - run: test/install/run.sh ${{ matrix.render }} --assets .
      - if: runner.os == 'Windows'
        shell: pwsh
        run: test/install/run.ps1 -Renderer ${{ matrix.render }} -Assets . -Registry

      - uses: actions/upload-artifact@v4
        with:
          name: spn-${{ matrix.id }}
          path: spn-${{ matrix.id }}.${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        if: matrix.id == 'x86_64-linux'
        with:
          name: installer-render
          path: ${{ matrix.render }}
