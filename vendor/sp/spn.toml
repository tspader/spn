[package]
namespace = "spader"
name = "sp"
url = "https://github.com/tspader/sp.git"
version = "3.3.0"
commit = "a64b2fde415d49da94d02173231757a5e9d8c4ba"
author = "tspader"
maintainer = "tspader"
system_deps = [
  { lib = "m", when = { os = "linux" } },
]

[[lib]]
name = "sp"
kinds = ["source"]

[publish]
copy = [
  { from = "source/sp.h", to = "include" },
  { from = "source/sp/*", to = "include/sp" },
]
