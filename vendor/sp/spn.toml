[package]
namespace = "spader"
name = "sp"
url = "https://github.com/tspader/sp.git"
version = "3.5.0"
commit = "9cda3f445e50e7d7ef6827119401d4f42bca2ead"
author = "tspader"
maintainer = "tspader"
system_deps = [
  { lib = "m", when = { os = "linux" } },
]

[[lib]]
name = "sp"
kinds = ["source"]

[publish]
copy = [
  { from = "source/sp.h", to = "include" },
  { from = "source/sp/*", to = "include/sp" },
]
