[package]
namespace = "spader"
name = "sp"
version = "3.5.0"
author = "tspader"
maintainer = "tspader"
system_deps = [
  { lib = "m", when = { os = "linux" } },
]

[package.upstream]
url = "https://github.com/tspader/sp.git"
commit = "e556929ddbfc7395c7a05a5b5a6841e5df425e7f"

[[lib]]
name = "sp"
kinds = ["source"]

[publish]
copy = [
  { from = "source/sp.h", to = "include" },
  { from = "source/sp/*", to = "include/sp" },
]
