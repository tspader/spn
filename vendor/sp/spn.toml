[package]
namespace = "spader"
name = "sp"
version = "3.5.0"
author = "tspader"
maintainer = "tspader"
system_deps = [
  { lib = "m", when = { os = "linux" } },
]

[package.upstream]
url = "https://github.com/tspader/sp.git"
commit = "a6c1733125b3d664bc544c29b5887fe19e78af5c"

[[lib]]
name = "sp"
kinds = ["source"]

[publish]
copy = [
  { from = "source/sp.h", to = "include" },
  { from = "source/sp/*", to = "include/sp" },
]
