[[toolchain]]
name = "gcc-lld"
driver = "gcc"
compiler = "gcc"
archiver = "ar"
cxx = "g++"
linker = "lld"
link_args = ["-fuse-ld=lld"]
host = { x86_64-linux = {}, aarch64-linux = {} }

[[toolchain]]
name = "aarch64-gnu"
driver = "gcc"
compiler = "aarch64-linux-gnu-gcc"
archiver = "aarch64-linux-gnu-ar"
host = { x86_64-linux = {} }
target = [{ arch = "aarch64", os = "freestanding", abi = "none" }]

[[toolchain]]
name = "mingw-gnu"
driver = "gcc"
compiler = "x86_64-w64-mingw32-gcc"
archiver = "x86_64-w64-mingw32-ar"
cxx = "x86_64-w64-mingw32-g++"
host = { x86_64-linux = {}, aarch64-linux = {} }
target = [{ arch = "x86_64", os = "windows", abi = "gnu" }]

[[toolchain]]
name = "musl-gcc"
driver = "gcc"
compiler = "musl-gcc"
archiver = "ar"
host = { x86_64-linux = {} }
target = [{ arch = "x86_64", os = "linux", abi = "musl" }]

[[toolchain]]
name = "clang-mingw"
driver = "clang"
compiler = "clang"
archiver = "x86_64-w64-mingw32-ar"
cxx = "clang++"
link_args = ["--ld-path=x86_64-w64-mingw32-ld", "-L/usr/lib/gcc/x86_64-w64-mingw32/12-win32"]
host = { x86_64-linux = {}, aarch64-linux = {} }
target = [{ arch = "x86_64", os = "windows", abi = "gnu" }]

[[toolchain]]
name = "clang-mingw-lld"
driver = "clang"
compiler = "clang"
archiver = "x86_64-w64-mingw32-ar"
cxx = "clang++"
linker = "lld"
link_args = ["-fuse-ld=lld", "-L/usr/lib/gcc/x86_64-w64-mingw32/12-win32"]
host = { x86_64-linux = {}, aarch64-linux = {} }
target = [{ arch = "x86_64", os = "windows", abi = "gnu" }]

[[toolchain]]
name = "clang-cross"
driver = "clang"
compiler = "clang"
archiver = "aarch64-linux-gnu-ar"
host = { x86_64-linux = {} }
target = [{ arch = "aarch64", os = "linux", abi = "gnu" }]

[[toolchain]]
name = "clang-bare"
driver = "clang"
compiler = "clang"
archiver = "ar"
host = { x86_64-linux = {} }
target = ["host", { arch = "x86_64", os = "freestanding", abi = "none" }]

[[toolchain]]
name = "clang-musl"
driver = "clang"
compiler = "clang"
archiver = "ar"
link_args = ["-rtlib=compiler-rt", "-unwindlib=none"]
host = { x86_64-linux = {} }
target = [
  { arch = "x86_64", os = "linux", abi = "gnu" },
  { arch = "x86_64", os = "linux", abi = "musl", sdk = "/sysroot/musl" },
]

[[toolchain]]
name = "clang-sysroot"
driver = "clang"
compiler = "clang"
archiver = "llvm-ar"
linker = "lld"
link_args = ["-fuse-ld=lld"]
host = { x86_64-linux = {} }
target = ["host", { arch = "aarch64", os = "linux", abi = "gnu", sdk = "/sysroot/arm64" }]

[[toolchain]]
name = "clang-wasi"
driver = "clang"
compiler = "clang"
archiver = "llvm-ar"
host = { x86_64-linux = {} }
target = [{ arch = "wasm32", os = "wasi", abi = "musl", sdk = "/usr" }]

[[toolchain]]
name = "clang-msvc"
driver = "clang"
compiler = "clang"
archiver = "llvm-ar"
cxx = "clang++"
linker = "lld"
link_args = ["-fuse-ld=lld"]
host = { x86_64-windows = {}, aarch64-windows = {} }
target = [
  { arch = "x86_64",  os = "windows", abi = "msvc", sanitizers = ["address"] },
  { arch = "aarch64", os = "windows", abi = "msvc" },
]

[[toolchain]]
name = "clang-xwin"
driver = "clang"
compiler = "clang-16"
archiver = "llvm-ar-16"
cxx = "clang++-16"
linker = "lld"
link_args = ["-fuse-ld=lld"]
host = { x86_64-linux = {} }
target = [{ arch = "x86_64", os = "windows", abi = "msvc", sdk = "/opt/xwin" }]

[[toolchain]]
name = "zig-local"
driver = "zig"
compiler = "/opt/zig/zig cc"
archiver = "/opt/zig/zig ar"
cxx = "/opt/zig/zig c++"
host = { x86_64-linux = {} }
target = [
  { arch = "wasm32",  os = "wasi",         abi = "musl" },
  { arch = "x86_64",  os = "linux",        abi = "gnu",   sanitizers = ["undefined", "thread"] },
  { arch = "x86_64",  os = "linux",        abi = "musl",  sanitizers = ["undefined", "thread"] },
  { arch = "aarch64", os = "linux",        abi = "gnu",   sanitizers = ["undefined", "thread"] },
  { arch = "aarch64", os = "linux",        abi = "musl",  sanitizers = ["undefined", "thread"] },
  { arch = "x86_64",  os = "macos",        abi = "apple", sanitizers = ["undefined", "thread"] },
  { arch = "aarch64", os = "macos",        abi = "apple", sanitizers = ["undefined", "thread"] },
  { arch = "x86_64",  os = "windows",      abi = "gnu",   sanitizers = ["undefined"] },
  { arch = "aarch64", os = "windows",      abi = "gnu",   sanitizers = ["undefined"] },
  { arch = "x86_64",  os = "windows",      abi = "msvc",  sanitizers = ["undefined"] },
  { arch = "aarch64", os = "windows",      abi = "msvc",  sanitizers = ["undefined"] },
  { arch = "x86_64",  os = "freestanding", abi = "none" },
  { arch = "aarch64", os = "freestanding", abi = "none" },
  { arch = "x86_64",  os = "linux",        abi = "none" },
  { arch = "aarch64", os = "linux",        abi = "none" },
]

