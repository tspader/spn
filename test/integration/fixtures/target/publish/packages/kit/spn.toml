[package]
name = "kit"
version = "1.0.0"

[publish]
copy = [
  { from = "source/kit.h", to = "include/kit.h" },
  { from = "source/sub/*", to = "include/kit" },
  { from = "source/on.h", to = "include/kit/on.h", when = { mode = "debug" } },
  { from = "source/off.h", to = "include/kit/off.h", when = { mode = "release" } },
]

[[lib]]
name = "kit"
kinds = ["source"]
