[package]
name = "test"
version = "0.1.0"

[deps.package]
spum = { path = "packages/spum" }

[[toolchain]]
name = "conly"
compiler = "cc"
linker = { elf = { family = "gnu" }, mingw = { family = "gnu" }, macho = { family = "ld64" } }
archiver = "ar"
driver = "gcc"

[profile.default]
toolchain = "conly"
linkage = "shared"

[[bin]]
name = "main"
source = ["main.c"]
