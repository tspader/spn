[package]
name = "elf_cross_gnu_script"
version = "0.1.0"

[[toolchain]]
name = "aarch64-gnu"
driver = "gcc"
compiler = "aarch64-linux-gnu-gcc"
archiver = "aarch64-linux-gnu-ar"
linker = { elf = { family = "gnu" } }
target = [{ arch = "aarch64", os = "freestanding", abi = "none" }]

[[bin]]
name = "main"
source = ["main.c"]
linker_script = ["main.ld"]
