[[toolchain]]
name = "A"
driver = "gcc"
compiler = "A"
archiver = "ar"
target = [{ arch = "x86_64", os = "windows", abi = "gnu", sdk = "toolchain" }]

[[toolchain]]
name = "B"
version = "1.0.0"
driver = "clang"
compiler = "B"
archiver = "B"
mirrors = "https://example.com/mirrors.txt"
host = { x86_64-linux = { url = "https://example.com/linux.tar.xz", sha256 = "aa" } }
target = [
  { arch = "x86_64", os = "linux", abi = "gnu" },
  { arch = "x86_64", os = "linux", abi = "musl", sdk = "toolchain" },
  { arch = "aarch64", os = "linux", abi = "gnu", sdk = "toolchain" },
  { arch = "aarch64", os = "linux", abi = "musl", sdk = "toolchain" }
]

