[package]
name = "tclinkers"
version = "1.0.0"

[[toolchain]]
name = "llvm"
compiler = "clang"
archiver = "llvm-ar"
driver = "clang"

[toolchain.linker.elf]
family = "lld"
program = "ld.lld"

[toolchain.linker.mingw]
family = "gnu"
program = "x86_64-w64-mingw32-ld"

[toolchain.linker.msvc]
family = "msvc"

[toolchain.linker.macho]
family = "ld64"

[toolchain.linker.wasm]
family = "lld"
