[package]
name = "profgated"
version = "1.0.0"

[profile.default]
abi = [
  { value = "gnu", when = { os = "linux" } },
  { value = "msvc", when = { os = "windows", arch = { not = "aarch64" } } },
  "musl",
]
toolchain = "zig"
linkage = { value = "static", when = { os = "linux" } }
mode = ["debug"]
