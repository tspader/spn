[package]
name = "p"
version = "1.0.0"

[[lib]]
name = "t"
kinds = ["static", "shared"]
source = ["a.c", { path = "b.c", when = { os = "linux" } }]
define = ["X", { value = "Y", when = { os = "windows" } }]
flags = [{ value = "-g", when = { mode = "debug" } }]
link_flags = [{ value = "-A", when = { os = "linux" } }]
linker_script = [{ path = "a.ld", when = { arch = "x86_64" } }]
system_deps = [{ value = "ws2_32", when = { os = "windows" } }]
